<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>写作台已升级 — xuwang</title><style>body{background:#f7f5ed;color:#303c32;font:16px/1.9 system-ui,sans-serif;max-width:700px;padding:32px;margin:9vh auto}h1{font:42px/1.5 Georgia,'Songti SC',serif;font-weight:400}a{color:#506b52}button,.button{display:inline-block;font:inherit;background:#596f50;color:#fff;border:0;border-radius:4px;padding:12px 20px;text-decoration:none;cursor:pointer;margin:8px 12px 8px 0}.card{border:1px solid #d7ddce;border-radius:6px;padding:25px;margin:25px 0}small{color:#777f70}#status{color:#73796d}</style></head><body><p>xuwang ✳ / YOUR WRITING DESK</p><h1>写作的地方，<br>也有了阅读的边界。</h1><p>新写作台支持文章与栏目的阅读权限、带理由的访问申请和审批。以后登录作者账户即可直接发布，无需 GitHub token。</p><a class="button" href="https://xuwang-notebook.hkusunny.chatgpt.site/blog/editor/" id="new-desk">进入新写作台 ↗</a><div class="card"><h2>把尚未发布的草稿带过去</h2><p>如果你曾在此浏览器写过尚未发布的内容，先导出备份；在新写作台点击「导入旧写作台备份」即可恢复。已发布的文章已经迁移。</p><button id="export">导出此浏览器的草稿 ↓</button><p id="status" role="status"></p><small>备份仅包含文字、目录、图片等写作数据，不包含 GitHub token。请妥善保管。</small></div><p><a href="https://xuwang-notebook.hkusunny.chatgpt.site/blog/">返回阅读空间 ↗</a></p><script>
const q=new URLSearchParams(location.search);if(q.has('post'))document.querySelector('#new-desk').href+='?post='+encodeURIComponent(q.get('post'));
document.querySelector('#export').onclick=async()=>{const out=document.querySelector('#status');try{const workspace=JSON.parse(localStorage.getItem('xuwang-desk-v1')||'null');if(!workspace){out.textContent='此浏览器没有旧写作台草稿，可以直接进入新写作台。';return;}const assets=await new Promise((resolve,reject)=>{const r=indexedDB.open('xuwang-assets',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('assets'))r.result.createObjectStore('assets',{keyPath:'path'});};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('assets','readonly'),read=tx.objectStore('assets').getAll();read.onsuccess=()=>resolve(read.result);read.onerror=()=>reject(read.error);tx.oncomplete=()=>db.close();}});const blob=new Blob([JSON.stringify({format:'xuwang-workspace-v2',workspace,assets},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='xuwang-old-drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);out.textContent='备份已导出，请到新写作台导入。';}catch{out.textContent='无法读取草稿，请保留此浏览器数据并联系作者。';}};
</script></body></html>

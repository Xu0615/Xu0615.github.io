ost" class="danger-button">删除文章</button></div></div><div class="format-toolbar" aria-label="Markdown 格式工具"><button data-insert="heading" title="标题">H₂</button><button data-insert="bold" title="粗体"><b>B</b></button><button data-insert="italic" title="斜体"><em>I</em></button><span></span><button data-insert="link" title="链接">↗ 链接</button><button id="upload-image" title="上传图片">▧ 图片</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><button data-insert="code" title="代码">&lt;/&gt;</button><button data-insert="math" title="公式">∑</button><button data-insert="table" title="表格">▦</button><button data-insert="diagram" title="流程图">◇</button><button data-insert="footnote" title="参考文献">[1]</button><div class="toolbar-right"><label><input id="sync-scroll" type="checkbox" checked> 同步滚动</label><button id="mobile-pane">切换预览</button></div></div><div class="split-editor"><section class="source-pane"><div class="pane-label"><span>MARKDOWN</span><span>⌘ S 保存草稿</span></div><div id="code-editor"></div></section><section class="preview-pane"><div class="pane-label"><span>LIVE PREVIEW / 实时预览</span><span id="word-count"></span></div><div id="markdown-preview" class="prose"></div></section></div><div class="editor-statusbar"><span>草稿保存在当前浏览器；发布后同步到 GitHub。</span><span id="publish-status" aria-live="polite"></span><span id="publish-warning" role="status"></span></div></section></main><dialog id="editor-dialog"></dialog><div class="toast" id="toast" role="status" hidden></div><script id="site-data" type="application/json">{"version":1,"updated":"2026-11-06","categories":[{"id":"pretrain","name":"Pretrain","zh":"预训练","description":"从训练目标到模型能力，记录每一次追问。","en":"Following the emergence of capability, one question at a time."},{"id":"data-scaling","name":"Data Scaling","zh":"数据与规模","description":"关注数据的质量、配比，以及规模背后的规律。","en":"On data, mixtures, and the patterns behind scale."},{"id":"interpretability","name":"Interpretability","zh":"可解释性","description":"走进模型内部，寻找能够被检验的解释。","en":"Looking inside models for explanations we can test."}],"posts":[{"id":"pretrain-notebook","category":"pretrain","title":"从一个 token 开始","subtitle":"A notebook on pretraining","summary":"把训练目标、数据与评估放在一起，慢慢理解模型能力是如何长出来的。","tags":["专题序言","研究笔记"],"date":"2026-11-06","updated":"2026-11-06","lang":"zh-CN","issue":1,"body":"> 这是 Pretrain 专题的开篇序言。这里会逐步收录学习笔记、论文阅读与可复现的实验记录。\n\n## 这里想记录什么\n\n从一个 token 的预测开始，走到模型整体能力的形成。这个栏目关注预训练中的目标函数、训练过程与评估，也关注那些没有在一张结果表中被完整解释的问题。\n\n写下一个结论时，也留下它的前提、证据和仍然不确定的地方。\n\n## 三条阅读线索\n\n1. **目标与优化**：模型在优化什么？训练曲线告诉了我们什么，又遗漏了什么？\n2. **数据与训练**：数据如何进入训练过程？哪些变化值得单独控制和比较？\n3. **评估与能力**：验证集的变化与我们真正关心的能力，如何建立联系？\n\n## 一篇笔记的约定\n\n| 部分 | 希望回答的问题 |\n| --- | --- |\n| 问题 | 为什么要研究它？ |\n| 设置 | 条件、数据和比较对象是什么？ |\n| 观察 | 实际看到了什么？ |\n| 边界 | 哪些解释仍然需要检验？ |\n\n笔记会持续修改。新的证据出现时，旧的理解也应当更新。\n\n## 接下来\n\n沿着训练过程继续探索，也把问题带到 [Data Scaling](../data-scaling-notebook/) 与 [Interpretability](../interpretability-notebook/) 中。\n"},{"id":"data-scaling-notebook","category":"data-scaling","title":"规模之外，数据之中","subtitle":"A notebook on data and scale","summary":"不只关心数据有多少，也关心模型看到了什么，以及我们如何做出比较。","tags":["专题序言","研究笔记"],"date":"2026-11-06","updated":"2026-11-06","lang":"zh-CN","issue":2,"body":"> 这是 Data Scaling 专题的开篇序言。先整理问题，再让阅读和实验逐步填满它。\n\n## 从数量走向结构\n\n关于数据，我希望同时记录两个视角：规模如何变化，以及数据本身如何组成。数量、质量、配比与重复，都值得被拆开讨论。\n\n## 想持续追问的问题\n\n- 在固定预算下，如何比较不同的数据选择？\n- 总体指标改善时，哪些子任务发生了变化？\n- 一个经验规律适用于什么范围？在什么条件下可能失效？\n- 如何记录数据处理过程，让一次实验能够被理解和复现？\n\n## 阅读的起点\n\nKaplan 等人的工作研究了语言模型损失与模型规模、数据量和训练计算量之间的经验关系。[^kaplan] Chinchilla 工作进一步研究了给定计算预算时，模型参数量与训练 token 数的分配。[^chinchilla]\n\n这两篇文章可以作为入口。后续笔记会区分论文中的结果、实验设定，以及在其他场景下仍需验证的推断。\n\n## 记录的方法\n\n给每次比较留下完整上下文：数据来源、处理方法、混合比例、训练预算、评估集，以及没有被解决的问题。\n\n[^kaplan]: Kaplan et al. (2020). [Scaling Laws for Neural Language Models](https://arxiv.org/abs/2001.08361).\n[^chinchilla]: Hoffmann et al. (2022). [Training Compute-Optimal Large Language Models](https://arxiv.org/abs/2203.15556).\n"},{"id":"interpretability-notebook","category":"interpretability","title":"让理解有迹可循","subtitle":"A notebook on interpretability","summary":"从“模型做了什么”，走向“为什么会这样”——也记录解释的边界。","tags":["专题序言","研究笔记"],"date":"2026-11-06","updated":"2026-11-06","lang":"zh-CN","issue":3,"body":"> 这是 Interpretability 专题的开篇序言。这里留给模型内部的结构、特征，以及能够被检验的假设。\n\n## 从观察到解释\n\n看到一种行为，是问题的开始。这个栏目希望继续追问：它与模型内部的哪些变化有关？我们如何区分相关性与更强的证据？\n\n## 计划整理的方向\n\n1. **表征与特征**：怎样描述模型内部的信息？一种表示保留了什么、忽略了什么？\n2. **电路与机制**：哪些组件参与了某种行为？证据如何支持这种解释？\n3. **干预与验证**：当我们改变内部状态时，模型行为是否按预期变化？\n\n## 给解释留下边界\n\n一个漂亮的可视化可以帮助理解，但还需要清楚的实验设置、比较对象和检验方法。这里会尽量把观察、假设与结论分别写明。\n\n## 与训练相遇\n\n解释性的问题也可以回到训练本身：能力在什么时候出现？数据变化后，内部表示发生了什么？\n\n这些问题会与 [Pretrain](../pretrain-notebook/) 和 [Data Scaling](../data-scaling-notebook/) 的笔记互相连接。\n"}],"revision":"447fa7cd-c1fb-4117-810e-21df14792f0a"}</script></body></html>
